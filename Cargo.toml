[package]
name = "astrohour-core"
version = "0.1.0"
edition = "2024"
description = "Standalone astronomical calculation core for AstroHour — planetary hours, moon phase, lunar day"
license = "MIT"
repository = "https://github.com/YOUR_ORG/astrohour-core"

[dependencies]
# Solar + lunar: sunrise/sunset, moon phase name/emoji/illumination
# Elongation (lunar day) is calculated directly via Meeus Ch.25/47 formulas
solunatus = "0.7"

# Time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Serialization (for Tauri IPC later)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"

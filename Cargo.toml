[workspace]
members = [".", "cli"]
resolver = "2"

[package]
name = "astrohour-core"
version = "0.1.0"
edition = "2024"
description = "Standalone astronomical calculation core for AstroHour — planetary hours, moon phase, lunar day"
license = "MIT"
repository = "https://github.com/ebthehealer/astrohour-core"

[dependencies]
# Solar + lunar: sunrise/sunset, moon phase name/emoji/illumination
solunatus = "0.7"

# Time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"

[package]
name = "astrohour-core"
version = "0.1.0"
edition = "2024"
description = "Standalone astronomical calculation core for AstroHour — planetary hours, moon phase, lunar day"
license = "MIT"
repository = "https://github.com/YOUR_ORG/astrohour-core"

[dependencies]
# Solar: sunrise/sunset, moon phase name/emoji/illumination, moonrise/moonset
solunatus = "0.7"

# Lunar: 0-360 degree elongation for lunar day calculation
esbat = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Serialization (for Tauri IPC later)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"

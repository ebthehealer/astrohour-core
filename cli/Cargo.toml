[package]
name = "astrohour-cli"
version = "0.1.0"
edition = "2024"
description = "CLI wrapper around astrohour-core for Noctalia plugin and shell scripting"
license = "MIT"

[[bin]]
name = "astrohour-cli"
path = "src/main.rs"

[dependencies]
astrohour-core = { path = ".." }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
